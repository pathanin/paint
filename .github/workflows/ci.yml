name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test test/*.test.js

  # The e2e scripts drive the app in the installed Google Chrome (channel 'chrome'), which the
  # ubuntu runner image ships. Each suite is its own step and runs even when an earlier one failed,
  # so one failure doesn't hide the others. bench.js is left out: its timings vary too much on
  # shared runners to gate on.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_PATH: /tmp/pw/node_modules
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright (dev-only, not a project dependency)
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm i --no-save --no-audit --no-fund playwright@1
          google-chrome --version
      - name: Serve the app
        run: |
          python3 -m http.server 8765 > /tmp/http.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8765/index.html > /dev/null && exit 0; sleep 0.5; done
          echo "server did not start"; cat /tmp/http.log; exit 1
      - name: smoke (http)
        if: ${{ !cancelled() }}
        run: node test/e2e/smoke.js
      - name: smoke (file://)
        if: ${{ !cancelled() }}
        run: node test/e2e/smoke.js "file://$PWD/index.html"
      - name: history
        if: ${{ !cancelled() }}
        run: node test/e2e/history.js
      - name: preview
        if: ${{ !cancelled() }}
        run: node test/e2e/preview.js
      - name: filledge
        if: ${{ !cancelled() }}
        run: node test/e2e/filledge.js
      - name: libs
        if: ${{ !cancelled() }}
        run: node test/e2e/libs.js
